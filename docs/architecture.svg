<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>How GoPort works</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0f0f17"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16161f"/>
      <stop offset="100%" stop-color="#101019"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="360" rx="16" fill="url(#bg)"/>
  <text x="450" y="44" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">How GoPort exposes localhost to the internet</text>

  <!-- Nodes -->
  <!-- Browser -->
  <g transform="translate(40,120)">
    <rect width="150" height="120" rx="12" fill="url(#node)" stroke="#00c8ff" stroke-opacity="0.35"/>
    <text x="75" y="40" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Browser</text>
    <text x="75" y="66" text-anchor="middle" fill="#7c8aa5" font-size="11">visits</text>
    <text x="75" y="86" text-anchor="middle" fill="#30f294" font-size="11" font-weight="600">abc123.goport.uz</text>
  </g>

  <!-- Server -->
  <g transform="translate(300,120)">
    <rect width="170" height="120" rx="12" fill="url(#node)" stroke="#00c8ff" stroke-opacity="0.45"/>
    <text x="85" y="38" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">GoPort Server</text>
    <text x="85" y="60" text-anchor="middle" fill="#7c8aa5" font-size="11">goport.uz</text>
    <text x="85" y="80" text-anchor="middle" fill="#7c8aa5" font-size="11">Host header → session</text>
    <text x="85" y="100" text-anchor="middle" fill="#7c8aa5" font-size="11">yamux.Server()</text>
  </g>

  <!-- CLI -->
  <g transform="translate(580,120)">
    <rect width="150" height="120" rx="12" fill="url(#node)" stroke="#00c8ff" stroke-opacity="0.45"/>
    <text x="75" y="38" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">goport CLI</text>
    <text x="75" y="60" text-anchor="middle" fill="#7c8aa5" font-size="11">your machine</text>
    <text x="75" y="80" text-anchor="middle" fill="#7c8aa5" font-size="11">yamux.Client()</text>
    <text x="75" y="100" text-anchor="middle" fill="#7c8aa5" font-size="11">dials localhost</text>
  </g>

  <!-- Local app -->
  <g transform="translate(800,150)">
    <rect width="70" height="60" rx="10" fill="url(#node)" stroke="#30f294" stroke-opacity="0.5"/>
    <text x="35" y="28" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">:8080</text>
    <text x="35" y="46" text-anchor="middle" fill="#7c8aa5" font-size="10">your app</text>
  </g>

  <!-- Connecting lines -->
  <line x1="190" y1="180" x2="300" y2="180" stroke="#26314a" stroke-width="2"/>
  <line x1="470" y1="180" x2="580" y2="180" stroke="#26314a" stroke-width="2"/>
  <line x1="730" y1="180" x2="800" y2="180" stroke="#26314a" stroke-width="2"/>

  <!-- Labels for links -->
  <text x="245" y="172" text-anchor="middle" fill="#54607a" font-size="10">HTTPS</text>
  <text x="525" y="172" text-anchor="middle" fill="#54607a" font-size="10">1 TCP conn + yamux streams</text>
  <text x="765" y="172" text-anchor="middle" fill="#54607a" font-size="10">TCP</text>

  <!-- Animated packets: request (cyan) traveling left -> right -->
  <circle r="5" fill="#00c8ff" filter="url(#glow)">
    <animate attributeName="cx" dur="3s" repeatCount="indefinite"
      keyTimes="0;0.25;0.5;0.75;1" values="190;300;525;730;835"/>
    <animate attributeName="cy" dur="3s" repeatCount="indefinite"
      keyTimes="0;0.25;0.5;0.75;1" values="180;180;180;180;180"/>
    <animate attributeName="opacity" dur="3s" repeatCount="indefinite"
      keyTimes="0;0.05;0.95;1" values="0;1;1;0"/>
  </circle>

  <!-- Animated packets: response (green) traveling right -> left -->
  <circle r="5" fill="#30f294" filter="url(#glow)">
    <animate attributeName="cx" dur="3s" begin="1.5s" repeatCount="indefinite"
      keyTimes="0;0.25;0.5;0.75;1" values="835;730;525;300;190"/>
    <animate attributeName="cy" dur="3s" begin="1.5s" repeatCount="indefinite"
      keyTimes="0;0.25;0.5;0.75;1" values="180;180;180;180;180"/>
    <animate attributeName="opacity" dur="3s" begin="1.5s" repeatCount="indefinite"
      keyTimes="0;0.05;0.95;1" values="0;1;1;0"/>
  </circle>

  <!-- Footer note -->
  <text x="450" y="300" text-anchor="middle" fill="#7c8aa5" font-size="12">
    The CLI always dials out — the server never connects back. One persistent TCP pipe carries every request.
  </text>
  <text x="450" y="324" text-anchor="middle" fill="#54607a" font-size="11">
    yamux multiplexes many concurrent requests over that single connection, each as an isolated stream.
  </text>
</svg>
