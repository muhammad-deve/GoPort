# Temporary config for initial SSL certificate setup
# Replace nginx.conf with this file before running init-ssl.sh
# After certificate is obtained, switch back to nginx.conf

server {
    listen 80;
    server_name goport.uz www.goport.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'GoPort is setting up SSL...';
        add_header Content-Type text/plain;
    }
}
