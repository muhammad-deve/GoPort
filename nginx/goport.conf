# Add this to your Barbershop nginx config.
# Barbershop nginx is the public gateway, so GoPort containers are reached
# through their host-published ports: landing 3005, backend 8095.

# Connection upgrade map for WebSocket support
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP -> HTTPS redirect for GoPort domains.
server {
    listen 80;
    listen [::]:80;
    server_name goport.uz www.goport.uz back.goport.uz *.goport.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Landing - goport.uz
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name goport.uz www.goport.uz;

    ssl_certificate /etc/letsencrypt/live/goport.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goport.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://172.17.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}

# Backend - back.goport.uz
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name back.goport.uz;

    ssl_certificate /etc/letsencrypt/live/goport.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goport.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    location / {
        proxy_pass http://172.17.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}

# Tunnel subdomains - abc123.goport.uz
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.goport.uz;

    ssl_certificate /etc/letsencrypt/live/goport.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goport.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    location / {
        proxy_pass http://172.17.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Disable buffering for tunnel responses
        proxy_buffering off;
        proxy_cache off;
        
        # Timeout settings for long-lived connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }
}
