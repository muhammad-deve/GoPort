upstream backend {
    server backend:8090;
}

upstream landing {
    server landing:3000;
}

upstream server {
    server server:8080;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name goport.uz www.goport.uz back.goport.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Landing - goport.uz
server {
    listen 443 ssl;
    server_name goport.uz www.goport.uz;

    ssl_certificate /etc/letsencrypt/live/goport.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goport.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://landing;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Backend - back.goport.uz
server {
    listen 443 ssl;
    server_name back.goport.uz;

    ssl_certificate /etc/letsencrypt/live/goport.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goport.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
