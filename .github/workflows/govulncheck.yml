name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly published vulnerabilities show up without a code change.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  this-repo:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: library
            dir: .
          - name: benchmarks
            dir: benchmarks

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The latest Go release, so standard-library findings reflect a
      # supported toolchain rather than the minimum in go.mod.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan
        working-directory: ${{ matrix.dir }}
        run: govulncheck ./...

  # The CLI and the tunnel server live in their own repositories and are fixed
  # there, so findings are reported in the job summary and as a warning
  # instead of failing this repository's checks.
  submodules:
    name: ${{ matrix.name }} (report only)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CLI
            dir: server
          - name: tunnel server
            dir: backend/app

    steps:
      - name: Check out with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan
        working-directory: ${{ matrix.dir }}
        run: |
          set +e
          govulncheck ./... > "$RUNNER_TEMP/govulncheck.txt" 2>&1
          status=$?
          {
            echo "## govulncheck: ${{ matrix.dir }}"
            echo
            echo '```'
            cat "$RUNNER_TEMP/govulncheck.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/govulncheck.txt"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=govulncheck ${{ matrix.dir }}::govulncheck exited with $status. See the job summary; fix it in that submodule's repository."
          fi
