name: Deploy GoPort

on:
  push:
    branches: [main]

# The deploy only uses SSH secrets, so the GitHub token can stay read-only.
permissions:
  contents: read

# One deploy at a time. A newer push waits instead of racing the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Host key check. Add the secret (SHA256 fingerprint of the server's
          # host key) to turn it on; while it's unset the check is skipped.
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          script: |
            set -e
            cd ~/personal/GoPort
            before=$(git rev-parse HEAD)
            git pull --ff-only origin main
            git submodule sync
            git submodule update --init --remote --recursive
            # The backend and landing repos build and restart their own
            # containers on every push, so this repo never builds them. A
            # second build here was redundant: landing is built with
            # `docker compose`, so this older `docker-compose` could not reuse
            # it and rebuilt the whole site, and a changed image restarted the
            # backend, which drops every live tunnel. Only a change to
            # docker-compose.yml itself is applied, with the existing images.
            if ! git diff --quiet "$before" HEAD -- docker-compose.yml; then
              docker-compose up -d --no-build --remove-orphans
            fi
