# Version updates for code that lives in this repository. The CLI, the tunnel
# server and the website are submodules with their own repositories, so their
# dependencies are updated there.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/benchmarks"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
