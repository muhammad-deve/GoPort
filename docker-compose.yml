version: "3.8"

services:
  nginx:
    build: ./nginx
    container_name: goport-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
      - landing
      - server
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: goport-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  backend:
    build: ./backend
    container_name: goport-backend
    expose:
      - "8090"
    volumes:
      - goport_backend_data:/app/pb_data
    restart: unless-stopped

  landing:
    build: ./landing
    container_name: goport-landing
    expose:
      - "3000"
    restart: unless-stopped

  server:
    build: ./server
    container_name: goport-server
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  goport_backend_data:
