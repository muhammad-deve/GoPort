<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8085 Microprocessor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff44;
            margin-bottom: 20px;
        }

        h2 {
            color: #ff6b6b;
            margin-bottom: 15px;
        }

        .container {
            background-color: #16213e;
            border: 2px solid #0f3460;
            border-radius: 12px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.1);
        }

        .hello {
            font-size: 2rem;
            color: #ffd700;
            margin: 20px 0;
            padding: 15px;
            background-color: #0f3460;
            border-radius: 8px;
            border-left: 4px solid #00ff88;
        }

        .registers {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .register {
            background-color: #0f3460;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #00ff88;
            color: #00ccff;
            font-weight: bold;
        }

        .register span {
            display: block;
            color: #ff6b6b;
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .info {
            color: #aaa;
            margin-top: 20px;
            line-height: 1.8;
            text-align: left;
            padding: 15px;
            background-color: #0a0a1a;
            border-radius: 8px;
        }

        .info li {
            list-style: none;
            padding: 4px 0;
        }

        .info li::before {
            content: "▸ ";
            color: #00ff88;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #00ff88, #00ccff);
            color: #1a1a2e;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>8085</h1>
        <h2>Microprocessor Simulator</h2>

        <div class="hello">Hello, World!</div>

        <h2>Registers</h2>
        <div class="registers">
            <div class="register">A <span>00H</span></div>
            <div class="register">B <span>00H</span></div>
            <div class="register">C <span>00H</span></div>
            <div class="register">D <span>00H</span></div>
            <div class="register">E <span>00H</span></div>
            <div class="register">H <span>00H</span></div>
            <div class="register">L <span>00H</span></div>
            <div class="register">F <span>00H</span></div>
        </div>

        <ul class="info">
            <li>8-bit microprocessor by Intel (1976)</li>
            <li>Clock speed: 3 MHz</li>
            <li>16-bit address bus, 8-bit data bus</li>
            <li>246 instructions</li>
            <li>6 general-purpose registers</li>
        </ul>

        <div class="badge">MVI A, 48H — MOV B, A</div>
    </div>
</body>
</html>
